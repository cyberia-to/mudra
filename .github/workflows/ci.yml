# CI for mudra.
#
# mudra depends on sibling crates through path deps (../neuron, ../hemera and,
# behind the `prove` feature, ../strata, ../nox, ../zheng; nox and zheng pull in
# lens, tade and honeycrisp), so every job lays out the same stand as the soft3
# release train: mudra, neuron, strata, hemera, lens, nox, zheng, tade and
# honeycrisp checked out side by side.
# The `lockfile` job resolves that stand and uploads the resulting Cargo.lock as
# an artifact so it can be committed.
# The `test` job runs `cargo test --locked`, exactly the release train's
# `stack-mudra` gate.
# The `prove` job checks the phase-2 feature still compiles; informational.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'release/**']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # empty = neuron's default branch
  NEURON_REF: ""
  # empty = strata's default branch
  STRATA_REF: ""
  # hemera's 0.4 line; set to main once hemera#25 (release/0.4 -> main) lands
  HEMERA_REF: release/0.4
  # lens's 0.2 line; set to master once lens#36 lands
  LENS_REF: release/0.2
  # nox's 0.4 line; set to master once the nox landing lands
  NOX_REF: release/0.4
  # zheng#73, the hemera 0.4 sweep; set to release/0.4 once #73 merges there,
  # master once the zheng landing lands
  ZHENG_REF: ci/hemera-0.4-sweep
  # empty = tade's default branch
  TADE_REF: ""
  # empty = honeycrisp's default branch
  HONEYCRISP_REF: ""

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mudra
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/neuron
          path: neuron
          ref: ${{ env.NEURON_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/nox
          path: nox
          ref: ${{ env.NOX_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/zheng
          path: zheng
          ref: ${{ env.ZHENG_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mudra
      - name: resolve the stand
        run: cargo metadata --format-version 1 > /dev/null
        working-directory: mudra
      - name: Cargo.lock changes
        run: git -C mudra diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cargo.lock
          path: mudra/Cargo.lock
      - name: committed Cargo.lock matches the stand
        run: git -C mudra diff --exit-code -- Cargo.lock

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: mudra
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/neuron
          path: neuron
          ref: ${{ env.NEURON_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/nox
          path: nox
          ref: ${{ env.NOX_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/zheng
          path: zheng
          ref: ${{ env.ZHENG_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mudra
      - name: cargo test
        run: cargo test --locked
        working-directory: mudra

  # Informational: tells whether the phase-2 `prove` feature still compiles
  # against nox 0.3 / zheng 0.4. Not a gate, so a red result does not fail the run.
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: mudra
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/neuron
          path: neuron
          ref: ${{ env.NEURON_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/strata
          path: strata
          ref: ${{ env.STRATA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/hemera
          path: hemera
          ref: ${{ env.HEMERA_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/lens
          path: lens
          ref: ${{ env.LENS_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/nox
          path: nox
          ref: ${{ env.NOX_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/zheng
          path: zheng
          ref: ${{ env.ZHENG_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/tade
          path: tade
          ref: ${{ env.TADE_REF }}
      - uses: actions/checkout@v4
        with:
          repository: cyberia-to/honeycrisp
          path: honeycrisp
          ref: ${{ env.HONEYCRISP_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mudra
      - name: cargo check (prove)
        run: cargo check --locked --features prove --all-targets
        working-directory: mudra
